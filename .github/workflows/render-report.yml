# zzcollab render-report.yml v2.8.0
#
# Renders all manuscripts to HTML (via compendium-env) and PDF (via
# ghcr.io/rgt47/rmd-xelatex). HTML output validates R code execution and
# package reproducibility. PDF output validates the full LaTeX pipeline.
# Both jobs must pass for the workflow to succeed.
#
# The xelatex image is maintained at https://github.com/rgt47/r-docker and
# published to ghcr.io/rgt47/rmd-xelatex. It uses system TeX Live rather
# than TinyTeX for deterministic CI behaviour.
#
name: Render Reports

on:
  push:
    branches: [ main, master ]
    paths:
      - 'analysis/**'
      - 'R/**'
      - 'renv.lock'
      - 'Dockerfile'
      - '.github/workflows/render-report.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'analysis/**'
      - 'R/**'
      - 'renv.lock'
      - 'Dockerfile'

jobs:
  render-html:
    name: Render HTML
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build project image
        run: docker build -t compendium-env .

      - name: Render all manuscripts to HTML
        run: |
          docker run --rm -e CI=true \
            -v ${{ github.workspace }}:/project \
            -w /project compendium-env \
            Rscript -e '
              renv::restore()
              rmds <- list.files(
                "analysis", pattern = "^report[.]Rmd$",
                recursive = TRUE, full.names = TRUE
              )
              cat("Found", length(rmds), "manuscripts\n\n")
              failed <- character()
              for (rmd in rmds) {
                cat("=== HTML:", rmd, "===\n")
                old_wd <- setwd(dirname(rmd))
                tryCatch(
                  rmarkdown::render(basename(rmd),
                                    output_format = "html_document"),
                  error = function(e) {
                    cat("FAILED:", conditionMessage(e), "\n")
                    failed <<- c(failed, rmd)
                  }
                )
                setwd(old_wd)
              }
              cat("\n=== summary ===\n")
              cat("rendered:", length(rmds) - length(failed), "\n")
              cat("failed:  ", length(failed), "\n")
              if (length(failed) > 0) {
                for (f in failed) cat("  ", f, "\n")
                quit(status = 1)
              }
            '

      - name: Upload HTML artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-html
          path: analysis/**/*.html
          retention-days: 30
          if-no-files-found: warn

  render-pdf:
    name: Render PDF
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: /tmp/renv-cache
          key: renv-xelatex-${{ hashFiles('renv.lock') }}
          restore-keys: renv-xelatex-

      - name: Render all manuscripts to PDF
        run: |
          mkdir -p /tmp/renv-cache
          docker run --rm -e CI=true \
            -v ${{ github.workspace }}:/project \
            -v /tmp/renv-cache:/home/rstudio/.local/share/renv \
            -e RENV_PATHS_CACHE=/home/rstudio/.local/share/renv \
            -w /project \
            ghcr.io/rgt47/rmd-xelatex:4.6.0 \
            Rscript -e '
              renv::restore()
              rmds <- list.files(
                "analysis", pattern = "^report[.]Rmd$",
                recursive = TRUE, full.names = TRUE
              )
              cat("Found", length(rmds), "manuscripts\n\n")
              failed <- character()
              for (rmd in rmds) {
                cat("=== PDF:", rmd, "===\n")
                old_wd <- setwd(dirname(rmd))
                tryCatch(
                  rmarkdown::render(basename(rmd),
                                    output_format = "pdf_document"),
                  error = function(e) {
                    cat("FAILED:", conditionMessage(e), "\n")
                    failed <<- c(failed, rmd)
                  }
                )
                setwd(old_wd)
              }
              cat("\n=== summary ===\n")
              cat("rendered:", length(rmds) - length(failed), "\n")
              cat("failed:  ", length(failed), "\n")
              if (length(failed) > 0) {
                for (f in failed) cat("  ", f, "\n")
                quit(status = 1)
              }
            '

      - name: Upload PDF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-pdf
          path: analysis/**/*.pdf
          retention-days: 30
          if-no-files-found: warn
